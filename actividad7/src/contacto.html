<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto - Lic. Marcela Suárez</title>
    <link rel="stylesheet" href="./Recursos/estilos/estilos.css">
</head>

<body>
    <header class="encabezado-sitio">
        <a href="./index.html" aria-label="Ir al inicio">
            <img src="recursos/imagenes/nutricionista.jpg" alt="Logo Lic. Marcela Suárez" width="150">
        </a>

        <nav>
            <a href="./index.html">
                Inicio
            </a>
            <a href="./contacto.html">
                Contacto
            </a>
        </nav>

    </header>
    <main class="contenido-principal">
        <h1>
            Formulario de Contacto
        </h1>
        <p>
            Si querés consultar disponibilidad de turnos o hacerme una pregunta sobre mis servicios,
            completá el siguiente formulario y te voy a responder a la brevedad.
        </p>

        <div class="contenedor-form">
            <form>
                <label for="nombre">Nombre completo:</label>
                <input type="text" id="nombre" name="nombre" required>

                <label for="email">Correo electrónico:</label>
                <input type="email" id="email" name="email" required>

                <label for="telefono">Teléfono:</label>
                <input type="tel" id="telefono" name="telefono">

                <label for="motivo">Motivo de la consulta:</label>
                <select id="motivo" name="motivo">
                    <option value="primera-consulta">Primera consulta</option>
                    <option value="seguimiento">Seguimiento</option>
                    <option value="deportiva">Consulta deportiva</option>
                    <option value="patologia">Consulta por patología (diabetes, hipertensión, colesterol)</option>
                    <option value="otro">Otro</option>
                </select>

                <label for="modalidad">Modalidad preferida:</label>
                <select id="modalidad" name="modalidad">
                    <option value="presencial">Presencial</option>
                    <option value="videollamada">Videollamada</option>
                </select>

                <label for="mensaje">Mensaje:</label>
                <textarea id="mensaje" name="mensaje" rows="5" cols="40"></textarea>

                <div>
                    <!-- Botón -->
                    <button type="submit">
                        Enviar consulta
                    </button>
                </div>
            </form>
        </div>

    </main>
    <footer class="pie-pagina">
        <p>Lic. Marcela Suárez - Nutricionista</p>
    </footer>
    <a href="https://wa.me/5493511234567" class="boton-flotante" aria-label="Escribirme por WhatsApp" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 3C6.48 3 2 6.94 2 11.5c0 2.34 1.16 4.44 3.06 5.94-.1.86-.42 2.02-1.31 3.2-.13.17-.02.42.2.42 1.9-.02 3.5-.9 4.4-1.55.83.2 1.72.3 2.65.3 5.52 0 10-3.94 10-8.31C21 6.94 16.52 3 12 3z"/>
        </svg>
     </a>


</body>

</html>
